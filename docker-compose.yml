name: chatvardage

services:
  generer-env:
    image: alpine:3.22
    container_name: chatvardage-generer-env
    working_dir: /infra
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - ./:/infra
    command:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache openssl >/dev/null &&
        if [ -f /infra/.env ]; then
          echo 'OK: .env existe déjà; secrets conservés.';
        else
          /bin/sh /infra/scripts/generer-env.sh;
        fi &&
        /bin/sh /infra/scripts/preparer-env-services.sh
    restart: "no"

  postgres:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "postgres"]
    image: chatvardage-postgres:17
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: chatvardage-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-postgres}
      POSTGRES_DB: postgres

      AUTH_DB: ${AUTH_DB:-chatvardage_auth}
      ROOMS_DB: ${ROOMS_DB:-chatvardage_rooms}
      MESSAGES_DB: ${MESSAGES_DB:-chatvardage_messages}
      CONFIG_DB: ${CONFIG_DB:-chatvardage_config}

      AUTH_DB_USER: ${AUTH_DB_USER:-auth_service}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_service_dev}

      ROOMS_DB_USER: ${ROOMS_DB_USER:-room_service}
      ROOMS_DB_PASSWORD: ${ROOMS_DB_PASSWORD:-room_service_dev}

      MESSAGES_DB_USER: ${MESSAGES_DB_USER:-message_service}
      MESSAGES_DB_PASSWORD: ${MESSAGES_DB_PASSWORD:-message_service_dev}

      CONFIG_DB_USER: ${CONFIG_DB_USER:-config_service}
      CONFIG_DB_PASSWORD: ${CONFIG_DB_PASSWORD:-config_service_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./.runtime-env/postgres:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'set -a; . /run/chatvardage/.env; set +a; pg_isready -U "$$POSTGRES_SUPERUSER" -d postgres'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully

    networks:
      - chatvardage

  adminer:
    image: chatvardage-adminer:6.1.1
    build:
      context: .
      dockerfile: docker/adminer.Dockerfile
    container_name: chatvardage-adminer
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - chatvardage

  redis:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "redis"]
    image: chatvardage-redis:7.4
    build:
      context: .
      dockerfile: docker/redis.Dockerfile
    container_name: chatvardage-redis
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-chatvardage_redis_dev}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data
      - ./.runtime-env/redis:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'set -a; . /run/chatvardage/.env; set +a; REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

    depends_on:
      generer-env:
        condition: service_completed_successfully

    networks:
      - chatvardage

  auth-service:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "auth"]
    build:
      context: ../A26_5A6_01-Authentification
      dockerfile: Dockerfile

    container_name: chatvardage-auth-service
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001

      DATABASE_URL: >-
        postgresql://${AUTH_DB_USER:-auth_service}:${AUTH_DB_PASSWORD:-auth_service_dev}@postgres:5432/${AUTH_DB:-chatvardage_auth}

      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_before_prod}
      JWT_DUREE_DE_VIE_HEURES: ${JWT_DUREE_DE_VIE_HEURES:-24}
      RUST_LOG: ${RUST_LOG:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SERVICES_COMPTE_SUPPRIME_URLS: http://room-service:3003,http://message-service:3004,http://user-config-service:3005
      SERVICES_SESSIONS_REVOQUEES_URLS: http://message-service:3004
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatvardage_internal_dev}

    volumes:
      - ./.runtime-env/auth:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "127.0.0.1:3001:3001"

    depends_on:
      generer-env:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

    networks:
      - chatvardage

  room-service:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "room"]
    build:
      context: ../A26_5A6_01-Room-Service
      dockerfile: Dockerfile

    container_name: chatvardage-room-service
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003

      DATABASE_URL: >-
        postgresql://${ROOMS_DB_USER:-room_service}:${ROOMS_DB_PASSWORD:-room_service_dev}@postgres:5432/${ROOMS_DB:-chatvardage_rooms}?schema=public

      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-3000}
      AUTH_CACHE_TTL_MS: ${AUTH_CACHE_TTL_MS:-10000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatvardage_internal_dev}
      MESSAGE_SERVICE_URL: http://message-service:3004

    volumes:
      - ./.runtime-env/room:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "127.0.0.1:3003:3003"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3003/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    networks:
      - chatvardage

  message-service:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "message"]
    build:
      context: ../A26_5A6_01-Message-Service
      dockerfile: Dockerfile

    container_name: chatvardage-message-service
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004

      DATABASE_URL: >-
        postgresql://${MESSAGES_DB_USER:-message_service}:${MESSAGES_DB_PASSWORD:-message_service_dev}@postgres:5432/${MESSAGES_DB:-chatvardage_messages}?schema=public

      REDIS_URL: redis://:${REDIS_PASSWORD:-chatvardage_redis_dev}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-3000}
      AUTH_CACHE_TTL_MS: ${AUTH_CACHE_TTL_MS:-10000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ROOM_SERVICE_URL: http://room-service:3003
      ROOM_SERVICE_TIMEOUT_MS: ${ROOM_SERVICE_TIMEOUT_MS:-3000}
      ROOM_ACCESS_CACHE_TTL_MS: ${ROOM_ACCESS_CACHE_TTL_MS:-10000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatvardage_internal_dev}

    volumes:
      - ./.runtime-env/message:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "127.0.0.1:3004:3004"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3004/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      room-service:
        condition: service_healthy

    networks:
      - chatvardage

  user-config-service:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "user-config"]
    build:
      context: ../A26_5A6_01-User-Config-Service
      dockerfile: Dockerfile

    container_name: chatvardage-user-config-service
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: >-
        postgresql://${CONFIG_DB_USER:-config_service}:${CONFIG_DB_PASSWORD:-config_service_dev}@postgres:5432/${CONFIG_DB:-chatvardage_config}?schema=public

      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatvardage_internal_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

    volumes:
      - ./.runtime-env/user-config:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "127.0.0.1:3005:3005"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3005/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    networks:
      - chatvardage

  dashboard:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "dashboard"]
    build:
      context: ../A26_5A6_01-Dashboard/dashboard-chatvardage
      dockerfile: Dockerfile

    container_name: chatvardage-dashboard
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ROOM_SERVICE_URL: http://room-service:3003
      MESSAGE_SERVICE_URL: http://message-service:3004

    volumes:
      - ./.runtime-env/dashboard:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "127.0.0.1:3002:3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/administration').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      message-service:
        condition: service_healthy

    networks:
      - chatvardage

  serveur-api:
    entrypoint: ["/bin/sh", "/infra/scripts/docker-entrypoint-env.sh", "serveur-api"]
    build:
      context: ../A26_5A6_01-Serveur-API
      dockerfile: Dockerfile

    container_name: chatvardage-serveur-api
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ROOM_SERVICE_URL: http://room-service:3003
      MESSAGE_SERVICE_URL: http://message-service:3004
      USER_CONFIG_SERVICE_URL: http://user-config-service:3005
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-5000}
      MAX_PROXY_BODY_BYTES: ${MAX_PROXY_BODY_BYTES:-1048576}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_CACHE_TTL_MS: ${AUTH_CACHE_TTL_MS:-10000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatvardage_internal_dev}

    volumes:
      - ./.runtime-env/serveur-api:/run/chatvardage:ro
      - ./scripts/docker-entrypoint-env.sh:/infra/scripts/docker-entrypoint-env.sh:ro

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    depends_on:
      generer-env:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      user-config-service:
        condition: service_healthy

    networks:
      - chatvardage

networks:
  chatvardage:
    name: chatvardage-network

volumes:
  postgres_data:
    name: chatvardage-c2_postgres_data
  redis_data:
    name: chatvardage-c2_redis_data
